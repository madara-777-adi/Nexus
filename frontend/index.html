<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>NexusSpace — AI-Assisted Learning OS</title>
    <meta name="description" content="NexusSpace generates a personalized, structured curriculum just-in-time as you learn — units, chapters, and lessons built by AI and adapted to your mastery." />
    <link rel="canonical" href="https://nexusspace.tech/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexusspace.tech/" />
    <meta property="og:title" content="NexusSpace — AI-Assisted Learning OS" />
    <meta property="og:description" content="A personalized, structured curriculum generated just-in-time as you learn — not a static, pre-built course." />
    <meta property="og:image" content="https://nexusspace.tech/og-image.png" />
    <meta property="og:site_name" content="NexusSpace" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nexusspace.tech/" />
    <meta name="twitter:title" content="NexusSpace — AI-Assisted Learning OS" />
    <meta name="twitter:description" content="A personalized, structured curriculum generated just-in-time as you learn — not a static, pre-built course." />
    <meta name="twitter:image" content="https://nexusspace.tech/og-image.png" />

    <!-- Theme color for mobile browser chrome -->
    <meta name="theme-color" content="#000000" />

    <!-- Structured data: tells Google what this site/app is -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "NexusSpace",
        "url": "https://nexusspace.tech/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "NexusSpace generates a personalized, structured curriculum just-in-time as you learn, powered by AI."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
